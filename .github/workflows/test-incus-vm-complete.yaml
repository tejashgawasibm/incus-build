name: Test ppc64le Runner
on: workflow_dispatch

jobs:
  test:
    runs-on: [self-hosted, ppc64le, ubuntu-24.04-vm]
    steps:
      - uses: actions/checkout@v4
      - name: Show system info
        run: |
          uname -a
          lscpu
          df -h
          free -h
      - name: Test basic commands
        run: |
          echo "Hello from ppc64le!"
          which docker
          which git
